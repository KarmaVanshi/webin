<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic DOM — fixture</title><link rel="stylesheet" href="fixtures.css"></head><body>
<header class="site"><h1>Dynamic DOM</h1><nav><ul><li><a href="index.html">All fixtures</a></li></ul></nav></header>
<main><p style="color:var(--muted)">Content that appears after load — saved changes must reapply when it does.</p>
<h2>Deferred content</h2>
<button class="btn primary" id="add">Add a card</button>
<button class="btn" id="modal-open">Open modal</button>
<div id="target" style="display:grid;gap:12px;margin-top:16px"></div>
<div id="modal" hidden style="position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.4)">
<div class="card" style="width:320px"><h3>Modal title</h3><p>Inserted after load.</p>
<button class="btn" id="modal-close">Close</button></div></div>
<script>
let n = 0;
document.getElementById('add').addEventListener('click', () => {
  n += 1;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h3>Card ' + n + '</h3><p>Added at ' + new Date().toLocaleTimeString() + '</p>';
  document.getElementById('target').append(card);
});
document.getElementById('modal-open').addEventListener('click', () => { document.getElementById('modal').hidden = false; });
document.getElementById('modal-close').addEventListener('click', () => { document.getElementById('modal').hidden = true; });
setTimeout(() => document.getElementById('add').click(), 400);
</script>
</main><footer class="site">Local fixture page. Not a real site.</footer></body></html>
